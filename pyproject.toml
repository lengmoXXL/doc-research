[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-research"
version = "0.1.0"
description = "文档处理 CLI：PDF/EPUB 转 Markdown（DocMind）、网页正文提取、PDF 页面导出、Markdown 渲染 HTML 站点"
requires-python = ">=3.10"
dependencies = [
  "alibabacloud-docmind-api20220711",
  "alibabacloud-tea-openapi",
  "alibabacloud-tea-util",
  "Pillow",
  "python-dotenv",
  "pymupdf",
  "trafilatura",
  # trafilatura 依赖的 justext 仍会 import lxml.html.clean（lxml 5.2+ 已拆分为独立包）
  "lxml_html_clean",
  # build 子命令（tr/*.md → dist/ HTML）
  "markdown",
  "pymdown-extensions",
  "pygments",
  "mdx_truly_sane_lists",
  # 49+ 的 macOS wheel 只剩 arm64，Intel Mac 会走源码编译（缺 OpenSSL 失败）；48.0.1 是最后的 universal2
  "cryptography<49",
]

[project.scripts]
doc-research = "doc_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_research"]
